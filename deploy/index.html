<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oyako Hotel — Maitama, Abuja</title>
<meta name="description" content="Ninety-four rooms and suites in the heart of Abuja.">
<meta name="theme-color" content="#FAF8F4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FAF8F4'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%239C7B4A' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%239C7B4A'/%3E%3C/svg%3E">

<footer class="site-footer" id="site-footer"></footer>

<div class="wa-fab" id="wa-fab"></div>

<noscript>

</html>
